<div
    class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 text-center">
        <!-- Icon -->
        <div class="flex justify-center">
            <div class="relative">
                <div class="absolute inset-0 bg-red-500 blur-3xl opacity-20 rounded-full"></div>
                <svg class="relative h-32 w-32 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
        </div>

        <!-- Error Code -->
        <div>
            <h1 class="text-8xl font-bold text-gray-900 tracking-tight">403</h1>
            <div class="mt-2 h-1 w-24 bg-red-500 mx-auto rounded-full"></div>
        </div>

        <!-- Message -->
        <div class="space-y-3">
            <h2 class="text-3xl font-bold text-gray-900">Access Forbidden</h2>
            <p class="text-lg text-gray-600 leading-relaxed">
                Sorry, you don't have permission to access this page. Please contact your administrator if you believe
                this is an error.
            </p>
        </div>

        <!-- Additional Info -->
        <div class="bg-white rounded-lg shadow-md p-6 space-y-4">
            <div class="flex items-start space-x-3">
                <svg class="h-6 w-6 text-gray-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div class="text-left">
                    <h3 class="text-sm font-semibold text-gray-900">Why am I seeing this?</h3>
                    <p class="text-sm text-gray-600 mt-1">You may not have the required role or permissions to view this
                        resource.</p>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-3 justify-center pt-4">
            <button (click)="goBack()"
                class="inline-flex items-center justify-center px-6 py-3 border border-gray-300 text-base font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors duration-200 shadow-sm">
                <svg class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Go Back
            </button>

            <button (click)="goHome()"
                class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors duration-200 shadow-sm">
                <svg class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Go to Homepage
            </button>
        </div>

        <!-- Footer -->
        <div class="pt-8 text-sm text-gray-500">
            Need help? <a href="mailto:support@yourcompany.com"
                class="text-red-600 hover:text-red-700 font-medium underline">Contact Support</a>
        </div>
    </div>
</div>
